<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-label="TurnAround Experts">
  <defs>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B1F5B"/>
    </linearGradient>
  </defs>
  <!-- Circular wordmark -->
  <path id="arcTop" fill="none" d="M 70 300 A 190 190 0 1 1 450 300"/>
  <text fill="#1D4ED8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="600" letter-spacing="6">
    <textPath href="#arcTop" startOffset="8%">TURN AROUND EXPERTS</textPath>
  </text>
  <!-- Bottom dots -->
  <circle cx="118" cy="420" r="5" fill="#1D4ED8"/>
  <circle cx="402" cy="420" r="5" fill="#1D4ED8"/>
  <!-- Head silhouette -->
  <path fill="url(#headGrad)" d="
    M 165 355
    C 150 300, 155 250, 175 210
    C 195 170, 235 145, 275 145
    C 315 145, 350 165, 365 200
    C 380 235, 375 275, 355 305
    C 340 330, 320 345, 300 355
    L 300 380
    C 300 395, 290 405, 275 405
    L 210 405
    C 185 405, 170 385, 165 355
    Z
  "/>
  <!-- Face profile cut (lighter crescent feel) -->
  <path fill="#0B1F5B" opacity="0.35" d="
    M 175 230
    C 185 200, 205 180, 230 170
    C 220 210, 215 250, 220 300
    C 225 330, 235 350, 250 365
    L 210 365
    C 190 350, 175 300, 175 230
    Z
  "/>
  <!-- Inner circle (brain field) -->
  <circle cx="290" cy="255" r="78" fill="#FFFFFF"/>
  <circle cx="290" cy="255" r="78" fill="none" stroke="#1E3A8A" stroke-width="3"/>
  <!-- Neural network nodes -->
  <g stroke="#1D4ED8" stroke-width="2.2" fill="none" stroke-linecap="round">
    <line x1="250" y1="215" x2="280" y2="200"/>
    <line x1="280" y1="200" x2="320" y2="210"/>
    <line x1="320" y1="210" x2="340" y2="240"/>
    <line x1="340" y1="240" x2="330" y2="275"/>
    <line x1="330" y1="275" x2="300" y2="295"/>
    <line x1="300" y1="295" x2="265" y2="285"/>
    <line x1="265" y1="285" x2="245" y2="255"/>
    <line x1="245" y1="255" x2="250" y2="215"/>
    <line x1="280" y1="200" x2="290" y2="240"/>
    <line x1="290" y1="240" x2="320" y2="210"/>
    <line x1="290" y1="240" x2="300" y2="295"/>
    <line x1="290" y1="240" x2="245" y2="255"/>
    <line x1="290" y1="240" x2="330" y2="275"/>
    <line x1="265" y1="285" x2="290" y2="240"/>
  </g>
  <!-- Nodes -->
  <g fill="#1D4ED8">
    <circle cx="250" cy="215" r="6"/>
    <circle cx="280" cy="200" r="7"/>
    <circle cx="320" cy="210" r="6"/>
    <circle cx="340" cy="240" r="6"/>
    <circle cx="330" cy="275" r="6"/>
    <circle cx="300" cy="295" r="7"/>
    <circle cx="265" cy="285" r="6"/>
    <circle cx="245" cy="255" r="6"/>
    <circle cx="290" cy="240" r="5"/>
  </g>
  <!-- Chip / processor -->
  <g transform="translate(302,248)">
    <rect x="-12" y="-12" width="24" height="24" rx="3" fill="#0B1F5B" stroke="#1D4ED8" stroke-width="1.5"/>
    <rect x="-7" y="-7" width="14" height="14" rx="1.5" fill="#1D4ED8"/>
    <line x1="-16" y1="-6" x2="-12" y2="-6" stroke="#1D4ED8" stroke-width="1.6"/>
    <line x1="-16" y1="0" x2="-12" y2="0" stroke="#1D4ED8" stroke-width="1.6"/>
    <line x1="-16" y1="6" x2="-12" y2="6" stroke="#1D4ED8" stroke-width="1.6"/>
    <line x1="12" y1="-6" x2="16" y2="-6" stroke="#1D4ED8" stroke-width="1.6"/>
    <line x1="12" y1="0" x2="16" y2="0" stroke="#1D4ED8" stroke-width="1.6"/>
    <line x1="12" y1="6" x2="16" y2="6" stroke="#1D4ED8" stroke-width="1.6"/>
    <line x1="-6" y1="-16" x2="-6" y2="-12" stroke="#1D4ED8" stroke-width="1.6"/>
    <line x1="0" y1="-16" x2="0" y2="-12" stroke="#1D4ED8" stroke-width="1.6"/>
    <line x1="6" y1="-16" x2="6" y2="-12" stroke="#1D4ED8" stroke-width="1.6"/>
    <line x1="-6" y1="12" x2="-6" y2="16" stroke="#1D4ED8" stroke-width="1.6"/>
    <line x1="0" y1="12" x2="0" y2="16" stroke="#1D4ED8" stroke-width="1.6"/>
    <line x1="6" y1="12" x2="6" y2="16" stroke="#1D4ED8" stroke-width="1.6"/>
  </g>
</svg>
